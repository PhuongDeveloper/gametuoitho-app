<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freej2me-web</title>
    <script>
    // [Universal Cache Resilience & Anti-Crash Patch] Eliminates net::ERR_CACHE_OPERATION_NOT_SUPPORTED in CheerpJ XHR & Fetch
    (function() {
        if (typeof window === 'undefined' || window._cheerpjUniversalPatched) return;
        window._cheerpjUniversalPatched = true;
        window._cheerpjSessionId = Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);

        // 1. Patch XMLHttpRequest (XHR) - Used by cheerpOS.js ddlSend for JRE libraries!
        if (window.XMLHttpRequest) {
            const origXhrOpen = XMLHttpRequest.prototype.open;
            const origXhrSend = XMLHttpRequest.prototype.send;
            
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                this._method = method;
                this._url = url;
                if (typeof url === 'string' && (url.includes('leaningtech.com') || url.includes('.jar') || url.includes('/jre/') || url.includes('/lib/'))) {
                    const sep = url.includes('?') ? '&' : '?';
                    if (!url.includes('_cb=')) {
                        url = url + sep + '_cb=' + window._cheerpjSessionId;
                        this._url = url;
                    }
                }
                return origXhrOpen.call(this, method, url, ...rest);
            };

            XMLHttpRequest.prototype.send = function(...args) {
                const xhr = this;
                if (xhr._url && typeof xhr._url === 'string' && (xhr._url.includes('leaningtech.com') || xhr._url.includes('.jar') || xhr._url.includes('/jre/'))) {
                    xhr.addEventListener('error', function(e) {
                        console.warn('[CheerpJ XHR Anti-Crash] XHR network/cache error intercepted for:', xhr._url, e);
                    });
                }
                return origXhrSend.apply(this, args);
            };
        }

        // 2. Patch window.fetch
        if (window.fetch) {
            const origFetch = window.fetch;
            window.fetch = async function(resource, init) {
                let opts = init ? Object.assign({}, init) : {};
                let urlStr = typeof resource === 'string' ? resource : (resource ? resource.url || resource.toString() : '');
                
                if (opts && opts.cache && (urlStr.includes('leaningtech.com') || urlStr.includes('.jar') || urlStr.includes('/jre/') || opts.cache === 'only-if-cached' || opts.cache === 'force-cache')) {
                    delete opts.cache;
                }
                if (urlStr && (urlStr.includes('leaningtech.com') || urlStr.includes('.jar') || urlStr.includes('/jre/'))) {
                    const sep = urlStr.includes('?') ? '&' : '?';
                    if (!urlStr.includes('_cb=')) {
                        urlStr = urlStr + sep + '_cb=' + window._cheerpjSessionId;
                    }
                }
                try {
                    return await origFetch.call(this, urlStr || resource, opts);
                } catch (err) {
                    const errStr = (err ? err.message || err.toString() || '' : '').toUpperCase();
                    if (errStr.includes('CACHE') || err.name === 'TypeError' || err.name === 'DOMException' || err.name === 'NetworkError') {
                        console.warn('[CheerpJ Fetch Anti-Crash] Retrying in no-store mode:', urlStr, err);
                        let cleanOpts = Object.assign({}, init || {});
                        delete cleanOpts.cache;
                        delete cleanOpts.integrity;
                        cleanOpts.cache = 'no-store';
                        const sep = urlStr.includes('?') ? '&' : '?';
                        return await origFetch.call(this, urlStr + sep + '_retry=' + Date.now(), cleanOpts);
                    }
                    throw err;
                }
            };
        }

        // 3. Patch window.caches (Cache Storage API)
        if (window.caches && window.caches.open) {
            const origOpen = window.caches.open;
            window.caches.open = async function(...args) {
                try {
                    const cache = await origOpen.apply(this, args);
                    if (cache) {
                        const origPut = cache.put;
                        cache.put = async function(...putArgs) {
                            try { return await origPut.apply(this, putArgs); }
                            catch (e) { console.warn('[CheerpJ Cache Put Bypassed]:', e); }
                        };
                        const origAdd = cache.add;
                        cache.add = async function(...addArgs) {
                            try { return await origAdd.apply(this, addArgs); }
                            catch (e) { console.warn('[CheerpJ Cache Add Bypassed]:', e); }
                        };
                        const origAddAll = cache.addAll;
                        cache.addAll = async function(...addAllArgs) {
                            try { return await origAddAll.apply(this, addAllArgs); }
                            catch (e) { console.warn('[CheerpJ Cache AddAll Bypassed]:', e); }
                        };
                    }
                    return cache;
                } catch (e) {
                    console.warn('[CheerpJ Cache Open Bypassed] Storage restricted by browser:', e);
                    return {
                        match: async () => undefined,
                        matchAll: async () => [],
                        add: async () => undefined,
                        addAll: async () => undefined,
                        put: async () => undefined,
                        delete: async () => false,
                        keys: async () => []
                    };
                }
            };
        }
    })();
    </script>
</head>
<style>
    html, body {
        height: 100%;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #000000;
        overflow: hidden;
    }
    #screen-area {
        background-color: #000000;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #display {
        background-color: #000000;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
        transform: translateZ(0);
        will-change: transform, contents;
        backface-visibility: hidden;
    }
    #display:focus {
        outline: none;
    }
    #loading {
        font-size: 2em;
    }

    .keypad-part {
        background-color: #222; /* Dark background for keypad areas */
        padding: 8px;
        display: flex; /* Use flex to center the grid */
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
    }

    .key-grid {
        display: grid;
        gap: 6px; /* Space between keys */
        width: 100%;
        height: 100%;
    }

    /* Grid definitions */
    .left-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 1fr);
    }

    .right-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
    }

    /* Individual Key Styles */
    .key {
        background-color: #3a3a3a; /* Dark key background */
        color: #e0e0e0; /* Light key text */
        border: 1px solid #555;
        border-radius: 5px;
        font-size: 1.5em; /* Larger text */
        font-weight: bold;
        cursor: pointer;
        display: flex;
        flex-direction: column; /* Allow stacking number/letters */
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none; /* Prevent text selection on click/drag */
        transition: background-color 0.1s ease, transform 0.05s ease;
        line-height: 1.1;
    }
    .key span { /* Style for secondary text like ABC */
        font-size: 0.4em;
        font-weight: normal;
        margin-top: 2px;
        color: #aaa;
    }

    .key.active {
        background-color: #6a6a6a;
        transform: scale(0.95); /* Slight shrink effect on press */
    }

    .arrow-key {
        font-size: 2em; /* Make arrows bigger */
    }

    .ok-key {
        font-size: 1.3em;
    }

    /* Styles for specifically smaller keys */
    .small-key {
        /* Instead of scaling the whole button, we control its size within the grid cell */
        width: 70%;
        height: 70%;
        font-size: 0.9em;
        align-self: end;   /* Center vertically in grid cell */
        /* Ensure padding/border don't make it too big */
        padding: 2px;
        line-height: 1;
    }

    .small-key-left {
        justify-self: left;
    }

    .small-key-right {
        justify-self: right;
    }


    #left-keys,
    #right-keys {
        display: none;
        position: absolute;
        bottom: 0;
    }

    #left-keys {
        left: 0;
    }

    #right-keys {
        right: 0;
    }

    #screen-area {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.kbd-portrait #left-keys,
    body.kbd-portrait #right-keys,
    body.kbd-landscape #left-keys,
    body.kbd-landscape #right-keys {
        display: flex;
    }

    body.kbd-portrait #left-keys,
    body.kbd-portrait #right-keys {
        width: 50%;
        height: 220px;
    }

    body.kbd-landscape #left-keys,
    body.kbd-landscape #right-keys {
        width: 220px;
        height: 100%;
    }

    /* max height in landscape mode */
    body.kbd-landscape #left-keys .key-grid,
    body.kbd-landscape #right-keys .key-grid {
        max-height: 400px;
    }

    body.kbd-portrait #screen-area {
        bottom: 220px;
    }

    body.kbd-landscape #screen-area {
        left: 220px;
        right: 220px;
    }

</style>
<body>
    <div id="screen-area">
        <canvas tabindex="0" id="display" style="display: none;"></canvas>
        <div id="loading">Loading...</div>
    </div>
    <div id="left-keys" class="keypad-part">
        <div class="key-grid left-grid">
            <button data-key="Digit1" class="key">1</button>
            <button data-key="Digit2" class="key">2 <span>ABC</span></button>
            <button data-key="Digit3" class="key">3 <span>DEF</span></button>
            <button data-key="Digit4" class="key">4 <span>GHI</span></button>
            <button data-key="Digit5" class="key">5 <span>JKL</span></button>
            <button data-key="Digit6" class="key">6 <span>MNO</span></button>
            <button data-key="Digit7" class="key">7 <span>PQRS</span></button>
            <button data-key="Digit8" class="key">8 <span>TUV</span></button>
            <button data-key="Digit9" class="key">9 <span>WXYZ</span></button>
            <button data-key="NumpadAsterisk" class="key">*</button>
            <button data-key="Digit0" class="key">0 <span>+</span></button>
            <button data-key="NumpadDivide" class="key">#</button>
        </div>
    </div>
    <div id="right-keys" class="keypad-part">
         <div class="key-grid right-grid">
            <button data-key="F1" class="key">L</button>
            <button data-key="ArrowUp" class="key arrow-key" aria-label="Up">↑</button>
            <button data-key="F2" class="key">R</button>
            <button data-key="ArrowLeft" class="key arrow-key" aria-label="Left">←</button>
            <button data-key="Enter" class="key ok-key">OK</button>
            <button data-key="ArrowRight" class="key arrow-key" aria-label="Right">→</button>
            <button data-key="Escape" class="key small-key small-key-left">Esc</button>
            <button data-key="ArrowDown" class="key arrow-key" aria-label="Down">↓</button>
            <button data-key="Maximize" class="key small-key small-key-right" aria-label="Maximize">⛶</button>
        </div>
    </div>
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
